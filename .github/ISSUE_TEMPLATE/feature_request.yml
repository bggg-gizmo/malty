name: Feature request
description: Suggest a Malty capability or improvement while preserving existing behavior.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Feature proposals are reviewed against existing behavior. Please identify the exact impact; no existing function or UI will be removed without explicit approval."
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain the task you need Malty to perform and what currently prevents it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Requested behavior
      description: Describe what should happen, including any expected buttons, screens, or network interactions.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and non-regression requirements
      description: Specify affected protocols, existing functions, offline behavior, and existing UI elements.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State how the feature can be tested or verified.
    validations:
      required: true
